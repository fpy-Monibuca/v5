global:
  loglevel: debug
  #disableall: true
  http: :8081
  tcp: :50052
gb28181:
  enable: true  # 是否启用GB28181协议
  serial: '34020000002000000002'
  #parent: udp:34020000001320000001@192.168.61.76:5060
  mediaip: 192.168.61.76  #流媒体收流IP,外网情况下使用公网IP,内网情况下使用网卡IP,不要用127.0.0.1
  sipip: 192.168.61.76  #SIP通讯IP,不管公网还是内网都使用本机网卡IP,不要用127.0.0.1
  password: "hw1234567"
  sip:
    listenaddr:
      - udp::5061
  onsub:
    pull:
      ^\d{20}/\d{20}$: $0
      ^gb_\d+/(.+)$: $1
  platforms:
    - enable: true  #是否启用平台
      name: "测试上级平台" #平台名称
      servergbid: "34020000002000000001" #上级平台GBID
      servergbdomain: "3402000000" #上级平台GB域
      serverip: 192.168.61.76 #上级平台IP
      serverport: 5060 #上级平台端口
      devicegbid: "34020000002000000002" #本平台设备GBID
      deviceip: 192.168.61.76 #本平台设备IP
      deviceport: 5061 #本平台设备端口
      username: "34020000002000000002" #SIP账号
      password: "hw1234567" #SIP密码
      expires: 3600 #注册有效期，单位秒
      keeptimeout: 60 #注册保持超时时间，单位秒
      civilCode: "340200" #行政区划代码
      manufacturer: "Monibuca" #设备制造商
      model: "GB28181" #设备型号
      address: "江苏南京" #设备地址
      register_way: 1
      platformchannels:
        - platformservergbid: "34020000002000000001" #上级平台GBID
          channeldbid: "34020000001320000002_34020000001320000002" #本平台通道DBID,格式为本平台设备ID_本平台通道ID
