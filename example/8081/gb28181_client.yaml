snap:
  enable: false
  onpub:
    transform:
      .+:
        output:
          -   watermark:
                text: "abcd"              # 水印文字内容
                fontpath: /Users/dexter/Library/Fonts/MapleMono-NF-CN-Medium.ttf          # 水印字体文件路径
                fontcolor: "rgba(255,165,0,1)" # 水印字体颜色，支持rgba格式
                fontsize: 36          # 水印字体大小
                offsetx: 0           # 水印位置X偏移
                offsety: 0           # 水印位置Y偏移
              timeinterval: 1s   # 截图时间间隔
              savepath: "snaps"  # 截图保存路径
              iframeinterval: 3  # 间隔多少帧截图
              querytimedelta: 3  # 查询截图时允许的最大时间差（秒）

crypto:
  enable: false
  isstatic: false
  algo: aes_ctr # 加密算法 支持 aes_ctr xor_c
  encryptlen: 1024
  secret:
    key: your key
    iv: your iv
  onpub:
    transform:
      .* : $0
onvif:
  enable: false
  discoverinterval: 3 # 发现设备的间隔，单位秒，默认30秒，建议比rtsp插件的重连间隔大点
  autopull: true
  autoadd: true
  interfaces: # 设备发现指定网卡，以及该网卡对应IP段的全局默认账号密码，支持多网卡
    - interfacename: 以太网  # 网卡名称 或者"以太网" "eth0"等，使用ipconfig 或者 ifconfig 查看网卡名称
      username: admin # onvif 账号
      password: admin # onvif 密码
    # - interfacename: WLAN 2 # 网卡2
    #   username: admin
    #   password: admin
  # devices: # 可以给指定设备配置单独的密码
  #   - ip: 192.168.1.1
  #     username: admin
  #     password: '123'
  #   - ip: 192.168.1.2
  #     username: admin
  #     password: '456'

webrtc:
  port: tcp:9001 # 监听端口

rtmp:
  tcp:
    autolisten: true # 是否自动监听
    certfile: "" # 证书文件
    keepalive: false # 是否启用KeepAlive
    keyfile: "" # 私钥文件
    listenaddr: :1936 # 监听地址，格式为ip:port，ip 可省略默认监听所有网卡
    listenaddrtls: "" # 监听地址，格式为ip:port，ip 可省略默认监听所有网卡
    listennum: 0 # 同时并行监听数量，0为CPU核心数量
    nodelay: false # 是否禁用Nagle算法
    readbuffer: 0 # 读缓冲区大小
    writebuffer: 0 # 写缓冲区大小

rtsp:
  tcp:
    autolisten: true # 是否自动监听
    certfile: "" # 证书文件
    keepalive: false # 是否启用KeepAlive
    keyfile: "" # 私钥文件
    listenaddr: :555 # 监听地址，格式为ip:port，ip 可省略默认监听所有网卡
    listenaddrtls: "" # 监听地址，格式为ip:port，ip 可省略默认监听所有网卡
    listennum: 0 # 同时并行监听数量，0为CPU核心数量
    nodelay: false # 是否禁用Nagle算法
    readbuffer: 0 # 读缓冲区大小
    writebuffer: 0 # 写缓冲区大小
  udpport: 20001-30000 # 媒体端口范围