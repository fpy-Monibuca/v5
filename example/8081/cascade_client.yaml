global:
  loglevel: debug
  disableall: true
  http: :8081
  tcp: :50052
cascadeclient:
  enable: true
  server: localhost:44944
  autopush: true
  secret: dexter
  onsub:
    pull:
      .*: m7s://$0
  subscribe:
    buffertime: 0s # 缓冲时长,从缓冲时长的关键帧开始播放
    iframeonly: false # 只要关键帧
    key: "" # 订阅鉴权key
    maxcount: 0 # 最大订阅者数量
    subaudio: true # 是否订阅音频
    submode: 0 # 订阅模式 # 可选值: 0:实时模式,1:首屏后不进行追赶
    subtype: "" # 订阅类型
    subvideo: true # 是否订阅视频
    syncmode: 1 # 同步模式 # 可选值: 0:采用时间戳同步,1:采用写入时间同步
    waittimeout: 10s # 等待流超时时间
    waittrack: all # 等待轨道 # 可选值: audio:等待音频,video:等待视频,all:等待全部
    writebuffersize: 1000 # 写缓冲大小
rtmp:
  enable: true
  tcp: :1936

