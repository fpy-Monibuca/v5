global:
  # 管理员界面配置
  admin:
    enablelogin: false # 启用登录机制
    filepath: admin.zip # 管理员界面文件路径
    homepage: home # 管理员界面首页
    # 用户列表,仅在启用登录机制时生效
    users:
  db:
    dbtype: sqlite # 数据库类型
    dsn: m7s.db # 数据库文件路径
  disableall: false # 禁用所有插件
  enableauth: false # 启用鉴权
  fataldir:
    fatal:
  hook: {}:
  http:
    certfile: "" # HTTPS证书文件
    cors: true # 是否自动添加CORS头
    idletimeout: 0s # 空闲超时
    keyfile: "" # HTTPS密钥文件
    listenaddr: :8080 # 监听地址
    listenaddrtls: :8443 # 监听地址HTTPS
    password: "" # 基本身份认证密码
    readtimeout: 0s # 读取超时
    username: "" # 基本身份认证用户名
    writetimeout: 0s # 写入超时
  # HTTP路由转发规则,key为正则表达式,value为目标地址
  location:
    ^/hdl/(.*): /flv/$1
  loglevel: debug # 可选值: trace:跟踪,debug:调试,info:信息,warn:警告,error:错误
  onpub:
    push: {}:
    record: {}:
    transform: {}:
  onsub:
    pull: {}:
    transform: {}:
  publicip:
    "":
  publicipv6:
    "":
  publish:
    buffertime: 0s # 缓冲时长，0代表取最近关键帧
    delayclosetimeout: 0s # 延迟自动关闭（无订阅时）
    dump: false
    idletimeout: 0s # 空闲(无订阅)超时
    key: "" # 发布鉴权key
    kickexist: false # 是否踢掉已经存在的发布者
    maxcount: 0 # 最大发布者数量
    maxfps: 60 # 最大FPS
    pausetimeout: 30s # 暂停超时时间
    pubaudio: true # 是否发布音频
    publishtimeout: 10s # 发布无数据超时
    pubtype: server # 发布类型
    pubvideo: true # 是否发布视频
    relaymode: remux # 转发模式 # 可选值: remux:转格式,relay:纯转发,mix:混合转发
    # RingSize范围
    ringsize:
      - 20
      - 1024
    scale: 1 # 缩放倍数
    speed: 1 # 发送速率
    waitclosetimeout: 0s # 延迟自动关闭（等待重连）
  pull: {}:
  pullproxy: []:
  pulseinterval: 5s # 心跳事件间隔
  pushproxy: []:
  quic:
    autolisten: true # 是否自动监听
    certfile: "" # 证书文件
    keyfile: "" # 私钥文件
    listenaddr: "" # 监听地址，格式为ip:port，ip 可省略默认监听所有网卡
  # 流别名
  streamalias:
  subscribe:
    buffertime: 0s # 缓冲时长,从缓冲时长的关键帧开始播放
    iframeonly: false # 只要关键帧
    key: "" # 订阅鉴权key
    maxcount: 0 # 最大订阅者数量
    subaudio: true # 是否订阅音频
    submode: 0 # 订阅模式 # 可选值: 0:实时模式,1:首屏后不进行追赶
    subtype: "" # 订阅类型
    subvideo: true # 是否订阅视频
    syncmode: 1 # 同步模式 # 可选值: 0:采用时间戳同步,1:采用写入时间同步
    waittimeout: 10s # 等待流超时时间
    waittrack: video # 等待轨道 # 可选值: audio:等待音频,video:等待视频,all:等待全部
    writebuffersize: 0 # 写缓冲大小
  tcp:
    autolisten: true # 是否自动监听
    certfile: "" # 证书文件
    keepalive: false # 是否启用KeepAlive
    keyfile: "" # 私钥文件
    listenaddr: :50051 # 监听地址，格式为ip:port，ip 可省略默认监听所有网卡
    listenaddrtls: "" # 监听地址，格式为ip:port，ip 可省略默认监听所有网卡
    listennum: 0 # 同时并行监听数量，0为CPU核心数量
    nodelay: false # 是否禁用Nagle算法
    readbuffer: 0 # 读缓冲区大小
    writebuffer: 0 # 写缓冲区大小
  transform: {}:
  udp:
    autolisten: true # 是否自动监听
    certfile: "" # 证书文件
    keyfile: "" # 私钥文件
    listenaddr: "" # 监听地址，格式为ip:port，ip 可省略默认监听所有网卡
